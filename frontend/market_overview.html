<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市場總覽</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="/static/kline_shared.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    color: #f0f6fc;
    white-space: nowrap;
  }

  #search {
    flex: 1;
    max-width: 320px;
    padding: 6px 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #e6edf3;
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }

  #search:focus { border-color: #58a6ff; }
  #search::placeholder { color: #484f58; }

  #stats {
    margin-left: auto;
    color: #8b949e;
    font-size: 12px;
    white-space: nowrap;
  }

  #last-updated {
    color: #484f58;
    font-size: 11px;
    white-space: nowrap;
  }

  .nav-links {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .nav-links a {
    color: #58a6ff;
    text-decoration: none;
    font-size: 12px;
  }

  .nav-links a:hover { text-decoration: underline; }
  .nav-soon { color: #555; cursor: default; pointer-events: none; font-size: 12px; }

  .table-wrap {
    overflow-x: auto;
    height: calc(100vh - 53px);
    overflow-y: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  thead th {
    position: sticky;
    top: 0;
    background: #161b22;
    color: #8b949e;
    font-weight: 500;
    padding: 8px 10px;
    text-align: right;
    border-bottom: 1px solid #21262d;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
  }

  thead th:first-child,
  thead th:nth-child(2) { text-align: left; }

  thead th:hover { color: #f0f6fc; background: #1c2128; }

  thead th.sorted-asc::after  { content: ' ▲'; font-size: 10px; }
  thead th.sorted-desc::after { content: ' ▼'; font-size: 10px; }

  /* Column widths */
  col.c-ticker  { width: 60px; }
  col.c-name    { width: 100px; }
  col.c-date    { width: 80px; }
  col.c-close   { width: 72px; }
  col.c-chg     { width: 68px; }
  col.c-pct     { width: 72px; }
  col.c-vol     { width: 80px; }
  col.c-buy     { width: 80px; }
  col.c-sell    { width: 80px; }
  col.c-net     { width: 80px; }
  col.c-c5d     { width: 72px; }
  col.c-c20d    { width: 72px; }

  tbody tr {
    border-bottom: 1px solid #161b22;
    transition: background 0.1s;
  }

  tbody tr:hover { background: #1c2128; }

  td {
    padding: 6px 10px;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  td:first-child { text-align: left; }
  td:nth-child(2) { text-align: left; color: #8b949e; overflow: hidden; text-overflow: ellipsis; }

  td.ticker-cell {
    color: #58a6ff;
    font-weight: 600;
  }

  .up   { color: #f85149; }
  .down { color: #3fb950; }
  .flat { color: #8b949e; }

  .conc-bar {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .conc-val { min-width: 44px; text-align: right; display: inline-block; }

  .bar-bg {
    width: 40px;
    height: 6px;
    background: #21262d;
    border-radius: 3px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    background: #58a6ff;
    transition: width 0.3s;
  }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    z-index: 200;
    flex-direction: column;
    gap: 12px;
    color: #8b949e;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #30363d;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #error-banner {
    display: none;
    padding: 10px 20px;
    background: #2d1517;
    color: #f85149;
    border-bottom: 1px solid #f85149;
    font-size: 12px;
  }

  tbody tr { cursor: pointer; }

  #chart-panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 420px;
    background: #0d1117;
    border-top: 1px solid #30363d;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.22s ease;
    z-index: 300;
  }
  #chart-panel.visible { transform: translateY(0); }

  #chart-panel-header {
    height: 40px;
    min-height: 40px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    flex-shrink: 0;
  }
  #chart-ticker-label {
    font-size: 15px;
    font-weight: 700;
    color: #f0f6fc;
    flex: 1;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  #chart-close-btn {
    background: none;
    border: none;
    color: #8b949e;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    border-radius: 4px;
  }
  #chart-close-btn:hover { color: #f0f6fc; background: #21262d; }
  #lwc-container { flex: 1; min-height: 0; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>載入市場資料…</span>
</div>

<div id="error-banner"></div>

<header>
  <h1>市場總覽</h1>
  <input id="search" type="text" placeholder="代號 / 股名搜尋…" autocomplete="off">
  <div id="stats"></div>
  <div id="last-updated"></div>
  <div class="nav-links">
    <a href="/">首頁</a>
    <a href="/backtest">選股</a>
    <a href="/watchlist-manager">自選股</a>
    <a href="/portfolio">Portfolio</a>
  </div>
</header>

<div class="table-wrap">
  <table id="main-table">
    <colgroup>
      <col class="c-ticker">
      <col class="c-name">
      <col class="c-date">
      <col class="c-close">
      <col class="c-chg">
      <col class="c-pct">
      <col class="c-vol">
      <col class="c-buy">
      <col class="c-sell">
      <col class="c-net">
      <col class="c-c5d">
      <col class="c-c20d">
    </colgroup>
    <thead>
      <tr>
        <th data-col="ticker"   data-type="str">代號</th>
        <th data-col="name"     data-type="str">股名</th>
        <th data-col="date"     data-type="str">日期</th>
        <th data-col="close"    data-type="num">收盤</th>
        <th data-col="day_chg"  data-type="num">漲跌</th>
        <th data-col="day_pct"  data-type="num">漲跌%</th>
        <th data-col="volume"   data-type="num">成交量(張)</th>
        <th data-col="buy_volume"  data-type="num">前15買(張)</th>
        <th data-col="sell_volume" data-type="num">前15賣(張)</th>
        <th data-col="amount"   data-type="num">籌碼淨額</th>
        <th data-col="concentration_5d"  data-type="num">集中5日</th>
        <th data-col="concentration_20d" data-type="num">集中20日</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div id="chart-panel">
  <div id="chart-panel-header">
    <span id="chart-ticker-label">—</span>
    <button id="chart-close-btn" onclick="closeChart()">✕</button>
  </div>
  <div id="lwc-container"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let allRows = [];
let filtered = [];
let sortCol = 'ticker';
let sortDir = 1; // 1 = asc, -1 = desc

// ── Fetch ──────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch('/api/market-overview');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allRows = await res.json();
    document.getElementById('loading').style.display = 'none';
    const dates = allRows.map(r => r.date).filter(Boolean);
    if (dates.length) {
      const latest = dates.sort().at(-1);
      document.getElementById('last-updated').textContent = `資料日期: ${latest}`;
    }
    applyFilter();
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    const banner = document.getElementById('error-banner');
    banner.textContent = `載入失敗: ${e.message}`;
    banner.style.display = 'block';
  }
}

// ── Filter ─────────────────────────────────────────────────────────────────
function applyFilter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  filtered = q
    ? allRows.filter(r =>
        (r.ticker || '').toLowerCase().includes(q) ||
        (r.name   || '').toLowerCase().includes(q))
    : allRows.slice();
  sortData();
}

// ── Sort ───────────────────────────────────────────────────────────────────
function sortData() {
  const col = sortCol;
  const dir = sortDir;
  const isNum = document.querySelector(`th[data-col="${col}"]`)?.dataset.type === 'num';

  filtered.sort((a, b) => {
    let av = a[col], bv = b[col];
    if (isNum) {
      av = av == null ? -Infinity : +av;
      bv = bv == null ? -Infinity : +bv;
      return (av - bv) * dir;
    }
    av = av ?? '';
    bv = bv ?? '';
    return av.localeCompare(bv, 'zh-TW') * dir;
  });

  renderTable();
}

// ── Format helpers ─────────────────────────────────────────────────────────
const fmt = (v, dec=2) => v == null ? '—' : Number(v).toLocaleString('zh-TW', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const fmtInt = v => v == null ? '—' : Math.round(v).toLocaleString('zh-TW');

function colorClass(v) {
  if (v == null) return 'flat';
  return v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
}

function sign(v) {
  if (v == null || v === 0) return '';
  return v > 0 ? '+' : '';
}

function concBar(v) {
  if (v == null) return '—';
  const pct = v * 100;
  const absPct = Math.min(Math.abs(pct), 100);
  const cls = pct < 0 ? 'down' : pct >= 60 ? 'up' : pct >= 30 ? '' : 'flat';
  const sign = pct < 0 ? '' : '+';
  return `<span class="conc-bar">
    <span class="conc-val ${cls}">${sign}${fmt(pct, 1)}%</span>
    <span class="bar-bg"><span class="bar-fill" style="width:${absPct}%;background:${pct < 0 ? '#f85149' : '#58a6ff'}"></span></span>
  </span>`;
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('tbody');
  const stats = document.getElementById('stats');
  stats.textContent = `${filtered.length.toLocaleString()} / ${allRows.length.toLocaleString()} 檔`;

  const chunks = [];
  for (const r of filtered) {
    const pctCls = colorClass(r.day_pct);
    const buyCls = (r.buy_volume ?? 0) > 0 ? 'up' : 'flat';
    const sellCls = (r.sell_volume ?? 0) < 0 ? 'down' : 'flat';
    const netCls = colorClass(r.amount);

    const vol = r.volume != null ? fmtInt(r.volume / 1000) : '—';

    chunks.push(`<tr data-ticker="${r.ticker}">
      <td class="ticker-cell">${r.ticker}</td>
      <td title="${r.name || ''}">${r.name || ''}</td>
      <td>${r.date || '—'}</td>
      <td>${fmt(r.close)}</td>
      <td class="${pctCls}">${sign(r.day_chg)}${fmt(r.day_chg)}</td>
      <td class="${pctCls}">${sign(r.day_pct)}${fmt(r.day_pct)}%</td>
      <td>${vol}</td>
      <td class="${buyCls}">${r.buy_volume != null ? fmtInt(r.buy_volume / 1000) : '—'}</td>
      <td class="${sellCls}">${r.sell_volume != null ? fmtInt(r.sell_volume / 1000) : '—'}</td>
      <td class="${netCls}">${r.amount != null ? fmtInt(r.amount / 1000) : '—'}</td>
      <td>${concBar(r.concentration_5d)}</td>
      <td>${concBar(r.concentration_20d)}</td>
    </tr>`);
  }
  tbody.innerHTML = chunks.join('');
  tbody.querySelectorAll('tr[data-ticker]').forEach(tr => {
    tr.addEventListener('click', () => openChart(tr.dataset.ticker));
  });
}

// ── Sort headers ───────────────────────────────────────────────────────────
document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) {
      sortDir *= -1;
    } else {
      sortCol = col;
      sortDir = col === 'ticker' || col === 'name' ? 1 : -1;
    }
    document.querySelectorAll('thead th').forEach(h => h.classList.remove('sorted-asc', 'sorted-desc'));
    th.classList.add(sortDir === 1 ? 'sorted-asc' : 'sorted-desc');
    sortData();
  });
});

// ── Search ─────────────────────────────────────────────────────────────────
let searchTimer;
document.getElementById('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilter, 80);
});

// ── Chart ──────────────────────────────────────────────────────────────────
function openChart(ticker) {
  document.getElementById('chart-ticker-label').textContent = ticker;
  document.getElementById('chart-panel').classList.add('visible');
  fetchKline(ticker);
}

function closeChart() {
  document.getElementById('chart-panel').classList.remove('visible');
  KlineChart.destroy(document.getElementById('lwc-container'));
}

async function fetchKline(ticker) {
  try {
    const resp = await fetch(`/kline/${ticker}?ma_window=10&bb_window=22`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    renderChart(await resp.json());
  } catch (e) { console.error('kline fetch:', e); }
}

function renderChart(rows) {
  const container = document.getElementById('lwc-container');
  KlineChart.render(container, rows, {
    volumeTopMargin: 0.91,
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeChart();
});

// ── Init ───────────────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
