<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Quant Backtest</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background:
    radial-gradient(circle at top, rgba(41,98,255,0.18), transparent 35%),
    linear-gradient(180deg, #10131b 0%, #131722 100%);
  color: #d1d4dc;
  font-family: -apple-system, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  width: min(100%, 760px);
}
h1 {
  font-size: 20px;
  font-weight: 700;
  color: #787b86;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.topbar {
  width: 100%;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}
.login-link {
  font-size: 12px;
  color: #d1d4dc;
  text-decoration: none;
  background: #2962ff;
  border: 1px solid #2962ff;
  padding: 8px 12px;
  border-radius: 8px;
}
.login-link:hover { background: #1a4fd4; border-color: #1a4fd4; }
.user-chip {
  font-size: 12px;
  color: #d1d4dc;
  border: 1px solid #2a2e39;
  background: rgba(30,34,45,0.9);
  padding: 8px 12px;
  border-radius: 8px;
}
.cards {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}
.card {
  width: 200px;
  background: #1e222d;
  border: 1px solid #2a2e39;
  border-radius: 8px;
  padding: 28px 20px;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  transition: border-color 0.15s, background 0.15s;
}
.card:hover { border-color: #2962ff; background: #222739; }
.card--soon { opacity: 0.4; cursor: default; pointer-events: none; }
.card-icon { font-size: 32px; }
.card-title { font-size: 14px; font-weight: 600; color: #d1d4dc; }
.card-desc { font-size: 11px; color: #787b86; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <a class="login-link" id="auth-link" href="/auth/google/login">Sign in with Google</a>
  </div>
  <h1>Quant Backtest</h1>
  <div class="cards">
    <a class="card" href="/market-overview">
      <div class="card-icon">🌏</div>
      <div class="card-title">Market Overview</div>
      <div class="card-desc">大盤概覽與個股排行<br>漲跌幅 / 成交量</div>
    </a>
    <a class="card" href="/backtest">
      <div class="card-icon">📊</div>
      <div class="card-title">Backtest</div>
      <div class="card-desc">條件篩選與回測<br>同一套入口與標的池</div>
    </a>
    <a class="card" href="/static/watchlist.html">
      <div class="card-icon">📋</div>
      <div class="card-title">Watchlist</div>
      <div class="card-desc">建立自訂選股清單<br>航運 / 電子 / 半導體</div>
    </a>
    <a class="card" href="/static/kline_draw.html">
      <div class="card-icon">✏️</div>
      <div class="card-title">Pattern Draw</div>
      <div class="card-desc">手繪 K 線型態<br>DTW 全市場比對</div>
    </a>
    <div class="card card--soon">
      <div class="card-icon">💼</div>
      <div class="card-title">Portfolio</div>
      <div class="card-desc">持倉紀錄與損益追蹤<br>Coming soon</div>
    </div>
  </div>
</div>
<script>
async function loadAuthStatus() {
  try {
    const resp = await fetch('/auth/me');
    const link = document.getElementById('auth-link');
    if (resp.ok) {
      const data = await resp.json();
      const user = data.user || {};
      const label = user.name || user.email || 'Signed in';
      link.className = 'user-chip';
      link.textContent = label;
      link.href = '#';
      link.onclick = async (e) => {
        e.preventDefault();
        await fetch('/auth/logout', { method: 'POST' });
        window.location.reload();
      };
    }
  } catch (e) {
    console.error('auth status failed:', e);
  }
}

loadAuthStatus();
</script>
</body>
</html>
