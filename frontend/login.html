<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quant Phronesis | Sign In</title>
<link rel="stylesheet" href="/static/shared_topbar.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #131722;
  color: #d1d4dc;
  font-family: -apple-system, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.login-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 16px;
}

.login-card {
  background: #1e222d;
  border: 1px solid #2a2e39;
  border-radius: 10px;
  padding: 48px 40px 40px;
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

.brand-mark {
  width: 40px;
  height: 40px;
  background: #2962ff;
  border-radius: 8px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-mark svg {
  width: 22px;
  height: 22px;
  fill: #fff;
}

.login-title {
  font-size: 20px;
  font-weight: 700;
  color: #f0f3fa;
  margin-bottom: 6px;
  letter-spacing: -0.2px;
}

.login-sub {
  font-size: 13px;
  color: #787b86;
  margin-bottom: 32px;
  text-align: center;
}

.google-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 20px;
  background: #fff;
  color: #1e222d;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  justify-content: center;
  transition: background 0.15s;
}

.google-btn:hover { background: #f0f0f0; }

.google-btn svg {
  flex-shrink: 0;
}

.login-divider {
  width: 100%;
  border: none;
  border-top: 1px solid #2a2e39;
  margin: 28px 0 20px;
}

.login-note {
  font-size: 11px;
  color: #4c525e;
  text-align: center;
  line-height: 1.6;
}

.login-note a { color: #2962ff; text-decoration: none; }
.login-note a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div id="app-topbar" data-topbar-auth="hide"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm13 0a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
    </div>
    <div class="login-title">Sign in to Quant Phronesis</div>
    <div class="login-sub">Access your watchlists, portfolio, and research tools.</div>

    <a id="google-login-btn" class="google-btn" href="/auth/google/login">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </a>

    <hr class="login-divider">
    <div class="login-note">
      Personal research tool — access by invitation only.<br>
      <a href="/">← Back to home</a>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const next = params.get('next');
if (next) {
  const btn = document.getElementById('google-login-btn');
  btn.href = '/auth/google/login?next=' + encodeURIComponent(next);
}
</script>
<script src="/static/shared_topbar.js"></script>
</body>
</html>
